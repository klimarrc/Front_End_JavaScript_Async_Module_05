<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>School Speed Limits</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>School Speed Limits</h1>
        <p>Explore the school speed limits in Winnipeg. You can filter the data by entering a keyword.</p>
    </header>

    <main>
        <form id="searchForm">
            <label for="keyword">Enter keyword to filter (optional):</label>
            <input type="text" id="keyword" placeholder="Type something...">
            <button type="submit">Fetch Data</button>
        </form>

        <div id="status"></div>
        <div id="tableContainer"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
